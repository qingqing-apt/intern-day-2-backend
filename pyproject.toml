[project]
name = "intern-day-2-backend"
version = "0.1.0"
description = "实习生第二天练习：FastAPI 登录鉴权 + 服务器指标采集 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7.0",
    "bcrypt>=4.0.1",
    "psutil>=6.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FastAPI 的 Depends(...) 写在参数默认值是官方惯用法，B008 属误报
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 测试需要先设置环境变量再导入应用，允许模块级导入顺序例外
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

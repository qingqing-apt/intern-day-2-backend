name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv 与依赖（按锁文件）
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: 同步依赖
        run: uv sync --frozen

      - name: 代码检查
        run: uv run ruff check .

      - name: 运行测试
        run: uv run pytest -q
